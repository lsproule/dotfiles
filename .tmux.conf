unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix
set-option -g base-index 1
set -g mouse on
setw -g mode-keys vi
bind-key -T copy-mode-vi y send-keys -X copy-selection



bind - split-window -v
bind \\ split-window -h
# bind-key -t vi-copy 'v' begin-selection     # Begin selection in copy mode.
# bind-key -t vi-copy 'C-v' rectangle-toggle  # Begin selection in copy mode.
# bind-key -t vi-copy 'y' copy-selection      # Yank selection in copy mode.

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-processes 'ssh'
set -g @resurrect-strategy-nvim 'session'

set -g @prefix_highlight_fg 'white' # default is 'colour231'
set -g @prefix_highlight_bg 'blue'  # default is 'colour04'
set -g status on
bind-key t run-shell 'tmux show -g -v status | grep -q on && tmux set -g status off || tmux set -g status on'

# Status bar background and text color
set -g status-bg "#252525"
set -g status-fg "#f5f5f5"

# Left side of the status bar
set -g status-left-length 40
set -g status-left "#[fg=#252525,bg=#d3494e,bold] TMUX #[fg=#d3494e,bg=#252525]"

# Right side of the status bar
set -g status-right-length 100
set -g status-right "#[fg=#d3494e] %Y-%m-%d  %H:%M #[fg=#f5f5f5] #h "

# Window list style
setw -g window-status-style fg="#5d6f71",bg="#252525"
setw -g window-status-current-style fg="#252525",bg="#d3494e",bold

# Pane borders
set -g pane-border-style fg="#5d6f71"
set -g pane-active-border-style fg="#d3494e"

# Command prompt style (when searching or renaming windows)
set -g message-style bg="#d3494e",fg="#252525"

# Copy mode highlight
set -g mode-style bg="#d3494e",fg="#252525"

# Reload tmux config with Prefix + r
bind r source-file ~/.tmux.conf \; display-message "Config Reloaded!"

run '~/.tmux/plugins/tpm/tpm'

